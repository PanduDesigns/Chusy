<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chusy · Martech Corporation</title>
<script>
  // Aplica el tema (claro/oscuro/clásico) ANTES del primer pintado, para no
  // dar un parpadeo del tema equivocado mientras carga el resto de la app.
  // Solo lee la caché de este navegador (misma clave que js/theme.js) — la
  // fuente de verdad de verdad es la cuenta (Firestore), pero eso solo se
  // puede leer una vez Firebase resuelve la sesión, y para entonces ya
  // habría dado tiempo a pintar con el tema que no toca. En cuanto
  // app.js arranca, reconcilia esto con lo que haya en la cuenta.
  try {
    var cachedTheme = localStorage.getItem('chusy:theme');
    if (cachedTheme === 'light' || cachedTheme === 'classic') {
      document.documentElement.dataset.theme = cachedTheme;
    }
  } catch (e) {}
</script>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@600;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=41">
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<!-- ============ LOADING SCREEN ============ -->
<!-- Se ve por defecto mientras Firebase comprueba si ya hay sesión iniciada,
     para no enseñar un parpadeo del formulario de login a quien ya tiene
     cuenta abierta en ese navegador. -->
<div id="loading-screen" class="loading-screen">
  <img src="assets/chusy-badge.png" alt="" class="loading-screen__logo">
</div>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" class="auth-screen hidden">
  <div class="auth-grid" aria-hidden="true"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <img src="assets/chusy-badge.png" alt="Chusy — Gestión de tareas" class="auth-brand__logo">
    </div>
    <p class="auth-brand__credit"><span class="auth-brand__dot"></span>Un producto de Martech Corporation</p>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab is-active" data-tab="login" role="tab" aria-selected="true" type="button">Entrar</button>
      <button class="auth-tab" data-tab="signup" role="tab" aria-selected="false" type="button">Crear cuenta</button>
    </div>

    <form id="login-form" class="auth-form" novalidate>
      <label class="field">
        <span class="field__label">Correo</span>
        <input class="field__input" type="email" name="email" required autocomplete="email">
      </label>
      <label class="field">
        <span class="field__label">Contraseña</span>
        <input class="field__input" type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="button" class="link-btn" id="btn-forgot-password">¿Has olvidado tu contraseña?</button>
      <p class="field__error" data-error></p>
      <button type="submit" class="btn btn--primary btn--block">
        <span class="btn__label">Entrar</span>
      </button>
    </form>

    <form id="signup-form" class="auth-form hidden" novalidate>
      <label class="field">
        <span class="field__label">Nombre</span>
        <input class="field__input" type="text" name="name" required autocomplete="name">
      </label>
      <label class="field">
        <span class="field__label">Correo del trabajo</span>
        <input class="field__input" type="email" name="email" required autocomplete="email">
      </label>
      <label class="field">
        <span class="field__label">Contraseña</span>
        <input class="field__input" type="password" name="password" required minlength="6" autocomplete="new-password">
      </label>
      <p class="field__hint">Mínimo 6 caracteres. La primera persona en registrarse queda como administradora del equipo.</p>
      <p class="field__error" data-error></p>
      <button type="submit" class="btn btn--primary btn--block">
        <span class="btn__label">Crear cuenta</span>
      </button>
    </form>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app-shell" class="app-shell hidden">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <button class="notif-bell" id="notif-bell" title="Notificaciones" hidden>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a5 5 0 0 0-5 5v3.2c0 .6-.2 1.2-.6 1.7L5 15.5c-.7.9 0 2.2 1.1 2.2h11.8c1.1 0 1.8-1.3 1.1-2.2l-1.4-2.6c-.4-.5-.6-1.1-.6-1.7V8a5 5 0 0 0-5-5Z"/>
        <path d="M9.5 20a2.5 2.5 0 0 0 5 0"/>
      </svg>
      <span class="notif-bell__dot" id="notif-bell-dot" hidden></span>
    </button>
    <div class="filterbar" id="filterbar"></div>
    <main class="main-content" id="main-content">
      <div class="empty-state" id="empty-state">
        <span class="empty-state__eyebrow">— SIN PROYECTO —</span>
        <h2>Crea o selecciona un proyecto para empezar</h2>
        <p>Los proyectos organizan las tareas de tu equipo en secciones. Puedes verlas en lista o en tablero.</p>
      </div>
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
